    <path d="M87 118c4-2 9-2.5 13-1.2 4-1.3 9-.8 13 1.2-3 5-8 8-13 8s-10-3-13-8z" fill="#9b2534"/>
    <path d="M88 118.6c5 2.4 19 2.4 24 0" stroke="#6d1622" stroke-width="1.2" fill="none"/>
    <path d="M83 115c1 2 2 3 4 3.4M117 115c-1 2-2 3-4 3.4" stroke="#6a3e26" stroke-width="1.2" fill="none" stroke-linecap="round"/>
