<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Vade, l'assistante de Vade Agency">
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3263"/><stop offset="1" stop-color="#0f2347"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1f16"/><stop offset="1" stop-color="#5a2c1c"/></linearGradient>
    <radialGradient id="skin" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#a86a45"/><stop offset="1" stop-color="#8a5435"/></radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="100" cy="100" r="96" fill="none" stroke="#d6b25e" stroke-width="3"/>
    <!-- hair back: bob -->
    <path d="M56 96c-4-40 18-68 46-68s50 28 46 68c-1 14 1 26 6 36-12 6-28 6-38 2V108H86v26c-10 4-26 4-36-2 5-10 7-22 6-36z" fill="url(#hair)"/>
    <!-- shoulders: black dress, one shoulder -->
    <path d="M24 200c4-30 24-44 50-48 8 6 18 9 26 9s18-3 26-9c26 4 46 18 50 48z" fill="#8a5435"/>
    <path d="M96 200c10-22 30-40 60-50 14 6 22 20 24 50z" fill="#111"/>
    <path d="M24 200c3-20 12-34 26-40l26 40z" fill="#111"/>
    <!-- neck -->
    <path d="M86 128h28v24c-6 8-22 8-28 0z" fill="#7d4a2e"/>
    <!-- necklace -->
    <path d="M84 150c6 14 26 14 32 0" stroke="#d6b25e" stroke-width="1.4" fill="none"/>
    <circle cx="100" cy="160.5" r="2.4" fill="#d6b25e"/>
    <!-- face -->
    <ellipse cx="100" cy="98" rx="31" ry="38" fill="url(#skin)"/>
    <!-- hair front: centre parting, curtains -->
    <path d="M100 36c-22 0-40 16-42 46 0 18 4 32 8 42 2-26 6-46 14-62 6-10 14-18 20-22z" fill="url(#hair)"/>
    <path d="M100 36c22 0 40 16 42 46 0 18-4 32-8 42-2-26-6-46-14-62-6-10-14-18-20-22z" fill="url(#hair)"/>
    <path d="M100 37v14" stroke="#2a150e" stroke-width="1.2"/>
    <!-- brows -->
    <path d="M80 86c5-4 12-4 16-1" stroke="#2a150e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M104 85c5-3 12-3 16 1" stroke="#2a150e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <path d="M83 97c2-3.6 8.5-3.6 10.5 0-2 2.2-8.5 2.2-10.5 0z" fill="#fff"/><circle cx="88.2" cy="96.6" r="2.4" fill="#24140c"/>
    <path d="M106.5 97c2-3.6 8.5-3.6 10.5 0-2 2.2-8.5 2.2-10.5 0z" fill="#fff"/><circle cx="111.8" cy="96.6" r="2.4" fill="#24140c"/>
    <path d="M81.5 96.6c3-4 10-4 13 0M105.5 96.6c3-4 10-4 13 0" stroke="#1a0e08" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M97 103c-2 6-3 9 0 10.5 2 1 4 1 6 0 3-1.5 2-4.5 0-10.5" stroke="#6a3b22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- lips: smile -->
    <path d="M88 119c6 3 18 3 24 0-2 7-7 10-12 10s-10-3-12-10z" fill="#7a2e2a"/>
    <path d="M90 119.6c6 2.2 14 2.2 20 0-1 2.4-5 3.4-10 3.4s-9-1-10-3.4z" fill="#fff" opacity=".9"/>
    <!-- cheeks -->
    <circle cx="82" cy="110" r="6" fill="#c27a55" opacity=".35"/><circle cx="118" cy="110" r="6" fill="#c27a55" opacity=".35"/>
  </g>
</svg>
