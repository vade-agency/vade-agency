<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Vade, l'assistante de Vade Agency" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3ecdc"/><stop offset="1" stop-color="#e6d6ad"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3263"/><stop offset="1" stop-color="#0f2347"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- hair back -->
    <path d="M52 92c-6-38 18-66 48-66s56 26 50 66c-2 14-6 26-10 34H62c-5-8-9-20-10-34z" fill="#1d1410"/>
    <!-- neck -->
    <path d="M86 128h28v22c-4 6-24 6-28 0z" fill="#7a4a30"/>
    <!-- suit -->
    <path d="M30 200c2-34 22-50 48-56l22 26 22-26c26 6 46 22 48 56z" fill="url(#suit)"/>
    <!-- blouse -->
    <path d="M78 144l22 26 22-26c-6-2-12-3-22-3s-16 1-22 3z" fill="#f7f3ea"/>
    <!-- lapels -->
    <path d="M78 144l22 26-12 30-18-44z" fill="#0a1a38"/>
    <path d="M122 144l-22 26 12 30 18-44z" fill="#0a1a38"/>
    <path d="M80 147l20 23" stroke="#b8892d" stroke-width="1.6" fill="none"/>
    <path d="M120 147l-20 23" stroke="#b8892d" stroke-width="1.6" fill="none"/>
    <!-- necklace -->
    <path d="M88 146c4 10 20 10 24 0" stroke="#d6b25e" stroke-width="1.4" fill="none"/>
    <circle cx="100" cy="155" r="3.2" fill="none" stroke="#d6b25e" stroke-width="1.6"/>
    <!-- face -->
    <ellipse cx="100" cy="96" rx="33" ry="39" fill="#8a5636"/>
    <!-- ears + earrings -->
    <ellipse cx="67" cy="100" rx="5" ry="8" fill="#7a4a30"/><ellipse cx="133" cy="100" rx="5" ry="8" fill="#7a4a30"/>
    <circle cx="66" cy="111" r="4" fill="none" stroke="#d6b25e" stroke-width="2.4"/>
    <circle cx="134" cy="111" r="4" fill="none" stroke="#d6b25e" stroke-width="2.4"/>
    <!-- hair front -->
    <path d="M64 88c0-30 16-50 38-50 24 0 38 20 36 46-8-14-22-24-40-24-14 0-26 10-34 28z" fill="#1d1410"/>
    <!-- brows -->
    <path d="M80 86c5-4 12-4 16-1" stroke="#1d1410" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M104 85c5-3 12-3 16 1" stroke="#1d1410" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <path d="M83 97c2-3.4 8-3.4 10 0-2 2-8 2-10 0z" fill="#fff"/><circle cx="88" cy="96.6" r="2.3" fill="#2a1a12"/>
    <path d="M107 97c2-3.4 8-3.4 10 0-2 2-8 2-10 0z" fill="#fff"/><circle cx="112" cy="96.6" r="2.3" fill="#2a1a12"/>
    <path d="M82 96.6c3-3.6 9-3.6 12 0M106 96.6c3-3.6 9-3.6 12 0" stroke="#1d1410" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M80 104c3 2 6 2 8 1M112 105c2 1 5 1 8-1" stroke="#a86a46" stroke-width="1.2" fill="none" opacity=".7"/>
    <!-- nose -->
    <path d="M97 102c-2 6-3 9 0 11 2 1 4 1 6 0 3-2 2-5 0-11" stroke="#6a3e26" stroke-width="1.6" fill="none" stroke-linecap="round"/>
